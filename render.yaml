# Render Blueprint - visualizador de dados Omie.
# Cria um Web Service Node no plano Free. Dorme apos ~15 min sem requisicao;
# a proxima leva ~30s-1min para acordar (sem perda de dado - o banco e o Neon,
# servico separado, nao dorme junto). Trocar para "starter" quando fizer
# sentido pagar por ficar sempre no ar.
#
# Os segredos NAO ficam aqui. DATABASE_URL, CREDENCIAIS_CHAVE e API_TOKEN
# entram como `sync: false` e sao preenchidos uma unica vez no painel do Render.
# Passo a passo completo em docs/deploy-render.md.

services:
  - type: web
    name: omie-orquestrador
    runtime: node
    plan: free
    region: oregon        # alinhe o projeto Neon a esta regiao (AWS us-west-2)
    branch: master
    # --include=dev: sem isso, o NODE_ENV=production (abaixo) faz o npm pular
    # as devDependencies (typescript, @types/*), e o `tsc` do build quebra por
    # falta de tipo. NODE_ENV so precisa valer em runtime (env.ts), nao no build.
    buildCommand: npm ci --include=dev && npm run build
    # O plano Free nao suporta preDeployCommand, entao a migration roda aqui,
    # antes do servidor subir. Idempotente (tabela schema_migrations) - seguro
    # rodar em todo start, inclusive ao acordar do sono no plano Free.
    startCommand: node dist/db/migrate.js && node dist/index.js
    # /health confere o banco (SELECT 1). Se o banco cair, o Render marca a
    # instancia como nao saudavel e nao roteia trafego para ela.
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: CREDENCIAIS_CHAVE
        sync: false
      - key: SESSAO_CHAVE
        sync: false
      - key: API_TOKEN
        sync: false
      # Liga o modo producao no env.ts: entre outras coisas, recusa subir se a
      # DATABASE_URL nao exigir TLS (sslmode=require). Explicito de proposito -
      # nao dependemos do Render setar isso sozinho.
      - key: NODE_ENV
        value: production
      - key: OMIE_BASE_URL
        value: https://app.omie.com.br/api/v1
      - key: LOG_LEVEL
        value: info
